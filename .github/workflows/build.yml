name: Build Windows installer

# Every push builds the installer. When package.json has a version that
# hasn't been released yet, the build is also published as a GitHub Release
# (installer + latest.yml), which is what the app's auto-updater reads.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Is this a new version?
        id: version
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Version $V has no release yet: it will be published."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Version $V is already released (or this isn't a push): build only."
          fi

      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      # One step creates the release with every file at once. (Letting
      # electron-builder publish uploaded files in parallel and could create
      # two releases for the same version, splitting the files between them.)
      - name: Publish release
        if: steps.version.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.version.outputs.version }}"
          test -f dist/latest.yml || { echo "dist/latest.yml is missing"; exit 1; }
          git log -1 --pretty=%B | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' > notes.md
          gh release create "v$V" \
            "dist/Hybrid-Launcher-Setup-$V.exe" \
            "dist/Hybrid-Launcher-Setup-$V.exe.blockmap" \
            dist/latest.yml \
            --title "Hybrid Launcher $V" --notes-file notes.md --target "$GITHUB_SHA"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Hybrid-Launcher-Setup
          path: dist/*.exe
